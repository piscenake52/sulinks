name: "logs"
description: "insert / update / delete"
title: "[DATA] logs"
body:
  - type: markdown
    attributes:
      value: |
        📅 [日付・時間をカレンダーで選ぶ](https://sard-under-links.blogspot.com/p/issuehelper.html)

  - type: input
    id: logid
    attributes:
      label: "logid"

  - type: input
    id: copy_text
    attributes:
      label: "COPY / 文字入力"

  - type: checkboxes
    id: copy
    attributes:
      label: "COPY"
      options:
        - label: "コピーして新規登録"

  - type: input
    id: date
    attributes:
      label: "date"
      
  - type: input
    id: time
    attributes:
      label: "time"

  - type: dropdown
    id: contents
    attributes:
      label: "contents"
      options:
        - ANNIVERSARY
        - BIRTHDAY
        - DEBUT
        - FORMATION
        - COLUMN
        - COOKING
        - DIARY
        - ETC
        - CAMPAIGN
        - CLOSE
        - MESSAGE
        - PLAYING
        - RESULT
        - EVENT
        - FANMEETING
        - RELEASEEVENT
        - FANCLUB
        - TELEPHONE
        - LIVE
        - MAGAZINE
        - MEDIA
        - BOOK
        - NEWSPAPER
        - MODEL
        - MOVIE
        - RADIO
        - RELEASE
        - BD
        - CD
        - DIGITAL
        - DVD
        - MUSICCARD
        - SALES
        - GOODS
        - SNS
        - STAGE
        - STREAMING
        - TICKET
        - TV
        - WEB
        - PODCAST
        - YOUTUBE

  - type: input
    id: contents_free
    attributes:
      label: "contents / 自由入力"

  - type: dropdown
    id: groups_sd
    attributes:
      label: "groups / SARD UNDERGROUND"
      multiple: true
      options:
        - SARD
        - YUA
        - MIU
        - IZM
        - HRM

  - type: input
    id: groups_free
    attributes:
      label: "groups / 自由入力"
      description: "SARD,YUA,MIU,IZM,HRM"

  - type: checkboxes
    id: stf
    attributes:
      label: "STF"
      options:
        - label: "STF"

  - type: input
    id: item_title
    attributes:
      label: "title"

  - type: input
    id: display_pc
    attributes:
      label: "display_pc"

  - type: input
    id: display_sp
    attributes:
      label: "display_sp"

  - type: input
    id: url
    attributes:
      label: "url"

  - type: input
    id: map
    attributes:
      label: "map"

  - type: input
    id: setlistid
    attributes:
      label: "setlistid"

  - type: dropdown
    id: relations_sd
    attributes:
      label: "relations / SARD UNDERGROUND"
      multiple: true
      options:
        - YUA
        - MIU
        - IZM
        - HRM

  - type: input
    id: relations_free
    attributes:
      label: "relations / 自由入力"

  - type: textarea
    id: repeat
    attributes:
      label: "繰り返し登録 (1行1回)"
      description: "新規のみ。1行1回（最大60件）。書式: YYYYMMDD [時刻 HHMM / - = なし] [| タイトル | contents | URL | display_sp]（空欄はフォームの値を使う）。titleの #数字 は回ごとに自動で+1"

  - type: input
    id: tags
    attributes:
      label: "tags"

  - type: textarea
    id: sns
    attributes:
      label: "sns"
      description: |
        x / instagram / youtube / tiktok / radiko

  - type: checkboxes
    id: clear
    attributes:
      label: "値の削除（更新時）"
      options:
        - label: "time"
        - label: "contents"
        - label: "title"
        - label: "display_pc"
        - label: "display_sp"
        - label: "url"
        - label: "map"
        - label: "groups"
        - label: "relations"
        - label: "setlistid"
        - label: "tags"
        - label: "sns"

  - type: checkboxes
    id: delete
    attributes:
      label: "DELETE"
      options:
        - label: "削除する"
