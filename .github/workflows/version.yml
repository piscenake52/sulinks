name: update version.json
on:
  push:
    branches: [main]
    paths: ['data/**']
permissions:
  contents: write
concurrency:
  group: version-json
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate version.json
        run: |
          h() { sha1sum "$1" | cut -d' ' -f1; }
          printf '{"commit":"%s","files":{"logs":"%s","songs":"%s","setlist":"%s"}}\n' \
            "${{ github.sha }}" \
            "$(h data/logs/logs.json)" "$(h data/songs/songs.json)" "$(h data/setlist/setlist.json)" > version.json
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update version.json [skip ci]"
          git pull --rebase origin main
          git push
