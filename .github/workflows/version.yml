name: update version.json
on:
  push:
    branches: [main]
    paths: ['data/**']
  schedule:
    - cron: '17 */6 * * *'   # 自動コミット(GITHUB_TOKEN)でデータが更新され push で動かなかったときの保険。変化がなければ何もしない
  workflow_dispatch:
  # すぐ反映したい場合: Issue処理などデータを更新するワークフロー名を書く
  # workflow_run:
  #   workflows: ['（ワークフロー名）']
  #   types: [completed]
permissions:
  contents: write
concurrency:
  group: version-json
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: generate version.json
        run: |
          h() { sha1sum "$1" | cut -d' ' -f1; }
          printf '{"commit":"%s","files":{"logs":"%s","songs":"%s","setlist":"%s"}}\n' \
            "$(git rev-parse HEAD)" \
            "$(h data/logs/logs.json)" "$(h data/songs/songs.json)" "$(h data/setlist/setlist.json)" > /tmp/version.json
          # データのハッシュが変わっていなければコミットしない(commit欄だけの変化では更新しない)
          if [ -f version.json ] && [ "$(jq -S .files version.json)" = "$(jq -S .files /tmp/version.json)" ] && jq -e '.commit | test("^[0-9a-f]{40}$")' version.json >/dev/null; then echo "no change"; exit 0; fi
          cp /tmp/version.json version.json
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update version.json [skip ci]"
          git pull --rebase origin main
          git push
