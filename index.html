/*<![CDATA[*/
html.fw body{opacity:0}body{transition:opacity .14s ease-out}   /* フォント(Anton)の読み込みと、位置合わせが終わるまで、画面を出さない(文字の形や位置が途中で変わって見えないように)。1.2秒たったら、読み込み中でも出す */
/* ===== 色の定数(画面の色は、ここと、JS の MONTH_THEME / TOUR_THEME / RELEASE_THEME の2か所) =====
   土台: --bg 背景 / --card カード / --line 線 / --fg 文字 / --mut 弱い文字
   面:   --card2 持ち上がった面(帯・ホバー) / --face チップ・タブの面 / --face-h ホバー / --face-a 押している間
   文字: --soft 明るい補助文字 / --dim 暗い補助文字     状態: --ok 成功・LIVE / --err エラー・日曜
   影:   --shade 影の色 / --bg-rgb 背景(透過用)
   テーマ色(--main・--main2・--on・--acc)は、月・ツアー・リリースに合わせて applyTheme() が差し替える */
:root{--bg:#0b0b0f;--card:#14141a;--line:#33333f;--fg:#f2f1ea;--mut:#a6a6b2;--card2:#262631;--face:#101016;--face-h:#1c1c25;--face-a:#23232d;--soft:#cfcfd8;--dim:#6d6d79;--ok:#4ade80;--err:#ff5a5a;--shade:0,0,0;--bg-rgb:11,11,15;--main:#00d9e8;--main-rgb:0,217,232;--main2:#00bcd0;--acc:#ff4fc4;--on:#002a30;--grad:linear-gradient(135deg,var(--main),var(--main2));--gx:0px;--tabh:0px;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#Blog1>h3{display:none}
#site{display:block;font:400 30px/1 "Anton",Impact,"Arial Narrow","Hiragino Sans",sans-serif;letter-spacing:.02em;color:var(--fg);text-decoration:none;padding:10px 0 4px}
@media(max-width:640px){#site{font-size:min(26px,calc((100vw - 181px) / 9.25))}}   /* 右のスイッチ・設定ボタンと同じ行に収まるよう、狭い画面ではタイトルを小さくする */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
a{color:inherit}button{font:inherit;color:inherit}
header{position:relative;z-index:5;background:rgba(var(--bg-rgb),.97);border-bottom:1px solid var(--line)}
.wrap{position:relative;max-width:var(--w,980px);margin:0 auto;padding:0 var(--gx)}
#top{display:flex;align-items:center;gap:12px;max-width:var(--w,980px);margin:0 auto;padding:0 var(--gx)}
#upd{flex:1;color:var(--mut);font:12px ui-monospace,monospace}@media(max-width:560px){#upd{display:none}}

#q{width:100%;margin:0 0 4px;padding:13px 15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px;outline:none}
#q:focus{border-color:var(--main)}
#q::placeholder,.rec input::placeholder{color:var(--mut);opacity:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0 2px}
.chip{border:1px solid var(--line);background:none;padding:2px 11px;border-radius:99px;font:12px ui-monospace,monospace;color:var(--mut);cursor:pointer}
.chip.on{background:var(--grad);border-color:transparent;color:var(--on);font-weight:700}
main{max-width:var(--w,980px);margin:0 auto;padding:10px var(--gx) calc(76px + var(--tabh))}
#count{color:var(--mut);font:12px ui-monospace,monospace;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:8px}

.meta{display:flex;justify-content:space-between;gap:8px;font:12px ui-monospace,monospace;color:var(--mut)}

.btn:hover,.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.main{background:var(--grad);border-color:transparent;color:var(--on);font-weight:700}
.btn.main:hover{color:var(--on);filter:brightness(1.1)}
.panel{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:2px}
.panel a,.panel button{text-align:left;background:none;border:0;padding:3px 0;color:var(--fg);font-size:12.5px;text-decoration:none;cursor:pointer}
.panel a:hover,.panel button:hover{color:var(--acc)}
.badge{padding:0 7px;border-radius:3px;border:1px solid currentColor;font-size:11px}
#qrow{display:flex;gap:6px;align-items:stretch}
#qrow #q{flex:1;min-width:0;width:auto}
#calBtn{flex:0 0 46px;margin:0 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
#calBtn:hover,#calBtn.is-open,#qrow:focus-within #calBtn{color:var(--main);border-color:var(--main)}   /* 検索窓にカーソルを入れたときと、押したときは青 */
#calBtn svg{width:20px;height:20px}
#qrow #calBtn.sel{border-color:var(--acc)}   /* カレンダーから日付を選んでいるとき、枠はアクセント色 */
.cal-pop{position:fixed;z-index:1100;width:300px;max-width:calc(100vw - 16px);padding:10px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(var(--shade),.55);user-select:none;-webkit-user-select:none}
.cal-pop[hidden]{display:none}
.cal-pop button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:8px}
.cal-head{display:flex;gap:4px;margin-bottom:6px}
.cal-nav{flex:0 0 34px;height:34px;font-size:15px;border:1px solid var(--line)!important}
.cal-title{flex:1;height:34px;font-size:14px;font-weight:700}
.cal-nav:hover,.cal-title:hover,.cal-foot button:hover,.cal-day:hover,.cal-mgrid button:hover{background:var(--card2)}
.cal-grid,.cal-mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-mgrid{grid-template-columns:repeat(3,1fr);gap:6px}
.cal-wd{text-align:center;font-size:12px;color:var(--mut);padding:2px 0 4px}
.cal-day{position:relative;height:40px;font-size:14px;padding-bottom:8px!important}
.cal-day.is-out{color:var(--dim)}
.cal-day.is-today,.cal-mgrid .is-today{box-shadow:inset 0 0 0 2px var(--acc)}
.cal-day.is-sel,.cal-mgrid .is-sel{background:var(--grad)!important;color:var(--on);font-weight:700}
.cal-mgrid button{height:44px;font-size:14px}
.mks{position:absolute;left:3px;right:3px;bottom:3px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.mk{width:6px;height:6px;border-radius:50%;background:var(--c)}
.mk.sq{border-radius:1px}.mk.dm{border-radius:1px;transform:rotate(45deg)}
.cal-leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}
.cal-leg span{display:inline-flex;align-items:center;gap:5px}
.cal-foot{display:flex;justify-content:space-between;margin-top:8px}
.cal-foot .leg-t{font-size:18px;opacity:.45}.cal-foot .leg-t.on{opacity:1}
.cal-leg-w{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .26s cubic-bezier(.2,.7,.2,1),opacity .2s}.cal-leg-w.open{grid-template-rows:1fr;opacity:1}.cal-leg-w>div{overflow:hidden;min-height:0}
.cal-foot button{height:34px;padding:0 14px;font-size:13px;color:var(--acc);font-weight:700}
.rec{max-width:520px;margin:10px 0;text-align:left}
.rec input{width:100%;padding:13px 38px 13px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px;text-align:left;margin:0;outline:none}
#recBtn{position:fixed;right:16px;bottom:calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));z-index:40;padding:10px 22px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--fg);letter-spacing:.06em;box-shadow:0 4px 14px rgba(var(--shade),.45);animation:rise .5s ease-out}
#recBtn.out{animation:fadeout 1s ease-in-out forwards;pointer-events:none}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
body.rec-on #topBtn{bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px))}
.rrow{display:flex;gap:8px;align-items:stretch;margin:10px 0}
.nm{position:relative;flex:1;min-width:0}
.clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:6px;background:none;color:var(--mut);font-size:16px;cursor:pointer}
.clr:hover{color:var(--fg);background:var(--card2)}
.clr[hidden]{display:none}
.rrow .btn{flex:none;padding:0 18px}
.rec .card{text-align:left;margin-top:16px;border-color:var(--acc)}
#none,#err{text-align:center;color:var(--mut);padding:40px 0}
dialog{width:min(480px,92vw);max-height:80vh;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:16px}
dialog::backdrop{background:rgba(var(--shade),.7)}
dialog h2{margin:0 0 2px;font-size:16px;padding-right:28px}
dialog ol{margin:10px 0;padding:0;list-style:none}
dialog li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
dialog li.hl{color:var(--acc);font-weight:700}
dialog li i{color:var(--mut);font:11px ui-monospace,monospace;width:22px;flex:none;padding-top:2px}
dialog li a{margin-left:auto;color:var(--acc);text-decoration:none}
.day-sec{margin-top:14px}
.agenda>.day-sec:first-child{margin-top:4px}
.day-h{box-shadow:-22px 0 0 0 var(--bg);position:relative;isolation:isolate;display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:7px 18px 7px 22px;font:700 16px ui-monospace,monospace;color:var(--fg);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.day-h::after{content:"";position:absolute;inset:0 0 0 -19px;z-index:-2;background:var(--card);clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%);transition:clip-path .26s cubic-bezier(.2,.9,.25,1.2)}   /* 閉じているときは、青い帯と同じく右端もまっすぐ。左端は青い帯の右の縁にくっつける(帯の下に少し潜らせる) */
.day-g:not(.closed)>.day-h::after{clip-path:polygon(16px 0,100% 0,calc(100% - 10px) 100%,6px 100%)}   /* 開くと、青い帯と同じく左右とも斜めになる(右端の切れ込みは10px) */
.day-h::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:18px;z-index:-1;background:var(--grad);clip-path:polygon(0 0,8px 0,8px 100%,0 100%);transition:clip-path .26s cubic-bezier(.2,.9,.25,1.2)}   /* 太さは最初の8px。縦線の上に重ねる。閉じているときはまっすぐ */
.day-g:not(.closed)>.day-h::before{clip-path:polygon(10px 0,18px 0,8px 100%,0 100%)}   /* 開くと斜め(見出しの帯と同じ向き・角度)。水平の太さは同じ8px */
.day-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s cubic-bezier(.2,.9,.25,1)}
.day-i{overflow:hidden;min-height:0;transition:opacity .2s}
.day-g.closed .day-w{grid-template-rows:0fr}.day-g.closed .day-i{opacity:0}

.day-h .tag{padding:0 9px;border-radius:99px;font-size:11px;background:var(--grad);color:var(--on)}
.day-h .tag.plain{background:none;border:1px solid var(--line);color:var(--mut)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hd .badge{flex:none;margin-top:3px}
#top{flex-wrap:wrap}
#modes{display:flex;gap:6px;margin-left:auto}
#modes .chip{padding:5px 15px;font-size:13px;letter-spacing:.04em}
.pbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font:700 14px ui-monospace,monospace}
.pb{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);font-size:18px;line-height:1;cursor:pointer;transition:border-color .18s,color .18s}
.pb:hover{border-color:var(--acc);color:var(--acc)}
.pbar .tag{padding:0 9px;border-radius:99px;font-size:11px;background:var(--grad);color:var(--on)}
.pbar .tag.plain{background:none;border:1px solid var(--line);color:var(--mut)}
@keyframes slideN{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideP{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#sug{position:absolute;left:0;right:52px;top:100%;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(var(--shade),.55);z-index:60;max-height:60vh;overflow:auto;animation:pop .16s ease-out}

#sug li.on,#sug li:hover{background:var(--card2)}
#sug li.hclr{color:var(--mut);font-size:12px;border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 6px 6px}
body.tab-setlist #modes{display:none}
.cb[hidden]{display:none}
.br{flex-basis:100%;height:0}
.sl-ctl{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.cb{position:relative}

.cb-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

.stat{display:flex;flex-wrap:wrap;gap:2px 12px;font:11px ui-monospace,monospace;color:var(--fg)}

@keyframes pTab{0%{transform:skewX(-15.5deg) scale(.9)}60%{transform:skewX(-15.5deg) scale(1.06)}100%{transform:skewX(-15.5deg)}}
.secbar{display:flex;gap:6px;margin:-4px 0 0;padding:0 10px}   /* 上のラインとタブ: 6px(mainの余白10px - 4px) */   /* 斜めの端が切れないよう左右に余白 */.secbar[hidden]{display:none}

.card.rail{position:relative;padding-top:34px}
.rl{position:absolute;left:-1px;top:-1px;height:24px;min-width:46px;padding:0 22px 0 12px;display:flex;align-items:center;background:var(--card2);color:var(--soft);font:500 13px ui-monospace,monospace;clip-path:polygon(0 0,100% 0,calc(100% - 6.7px) 100%,0 100%)}   /* 日付の帯のミニ版: 暗い帯・右は斜め・左に青い斜めのライン(常に斜め) */
.rl::before{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:var(--grad);clip-path:polygon(9.7px 0,13.7px 0,7px 100%,3px 100%)}   /* 青い斜めのラインは右側(帯の右端と同じ斜め) */
.rl.nt{min-width:26px;padding:0}
.day-r{margin:12px 0 6px}
/* ===== 日付の帯 + 縦線(タイムライン): 全画面で同じ見え方 ===== */
.agenda,.tlv{position:relative;padding:2px 0 0 20px}
.agenda::before,.tlv::before{content:"";position:absolute;left:3px;top:10px;bottom:0;width:2px;background:var(--line)}   /* 一番上の日付の帯の位置から始める(上にはみ出さない) */
.tour-g{margin-top:18px}
.tour-g:first-child{margin-top:4px}
.tour-h{box-shadow:-22px 0 0 0 var(--bg);position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;width:100%;box-sizing:border-box;margin:0;padding:7px 18px 8px 13px;background:none;border:0;color:var(--fg);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}   /* TOURのツアー見出し: 見出し(Tourなど)と同じピンクの斜めの帯と、帯につながるピンクの下線。帯は日付の青い帯と同じ位置(左端がタイムラインの縦線に重なる)。見出しの高さの間は縦線を背景色で隠し、縦線は帯の下端から出るようにする(日付の帯と同じ作り) */
.tour-h::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:8px;background:var(--acc);transform:skewX(-15.5deg);transform-origin:left bottom;transition:transform .26s cubic-bezier(.2,.9,.25,1.2)}   /* 水平の太さ8px。角度は、ほかの帯・見出しと同じ15.5度(高さが変わっても同じ角度) */
.tour-h::after{content:"";position:absolute;left:-20px;right:0;bottom:0;height:2px;background:var(--acc)}
.tour-g.tclosed .tour-h::before{transform:none}   /* 閉じているときは、見出しと同じく帯がまっすぐ */
.tour-h .tn{max-width:calc(100% - 30px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:900 20px/1.25 'M PLUS 1p','Noto Sans JP','Hiragino Sans',sans-serif;letter-spacing:.02em;transform:skewX(-15.5deg);transform-origin:left bottom;transition:transform .26s cubic-bezier(.2,.9,.25,1.2)}
.tour-g.tclosed .tour-h .tn{transform:none}
.tour-h .chv{opacity:.75;transform:rotate(225deg)}
.tour-g.tclosed .tour-h .chv{transform:rotate(45deg)}
.tour-h:hover{filter:brightness(1.2)}.tour-h:active{filter:brightness(1.3)}
.tour-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s cubic-bezier(.2,.9,.25,1)}
.tour-i{position:relative;overflow:hidden;min-height:0;padding:8px 0 0 24px;margin-left:-24px;transition:opacity .2s}
.agenda:has(>.tour-g)::before{display:none}   /* タイトル枠(ツアー名など)があるときは、タイムラインを枠ごとに分け、枠と枠の間はつなげない */
.agenda:has(>.tour-g)>.day-g::before{content:"";position:absolute;left:-17px;top:0;bottom:0;width:2px;background:var(--line);transition:bottom .26s cubic-bezier(.2,.9,.25,1)}   /* 枠に入らない日付の帯は、日付の帯が続く間だけ縦線でつなぐ */
.agenda:has(>.tour-g)>.day-g:has(+.day-g)::before{bottom:-7px}
.agenda:has(>.tour-g)>.day-g.closed:not(:has(+.day-g))::before{bottom:8px}
.tour-g+.day-g{margin-top:18px}
.agenda:has(>.tour-g)>.day-g:first-child{margin-top:4px}
.tour-i::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line);transition:bottom .26s cubic-bezier(.2,.9,.25,1)}
.tour-i:has(>.day-g:last-child.closed)::before{bottom:8px}   /* 最後の日付の帯が閉じているときは、縦線を帯の下端で止める(帯の下の余白にはみ出さない) */   /* ツアー見出しの下線から、そのツアーの最後までの縦線 */   /* 日付の帯の左のはみ出し(最大22px)が切れないよう、左に余白を取る */
.tour-g.tclosed .tour-w{grid-template-rows:0fr}.tour-g.tclosed .tour-i{opacity:0}
.day-g{position:relative}
.agenda>.day-g:first-child,.tlv>.day-g:first-child{margin-top:3px}
.hero-h+.agenda,.hero-h+.tlv{margin-top:-5px}   /* 見出しと先頭の日付の間隔(Today など)は、以前の半分(20px→10px)。年月チップが続く見出し(BEFORE・AFTER・RESULTS)は今までどおり */
.tlv>.day-g+.day-g{margin-top:14px}   /* Nextの日と日の間隔を、BEFORE/AFTERの日の区切りと同じに */
.day-h,.tlv>.day-g,.tlv>.more-b,.agenda>.day-sec{transition:margin .26s cubic-bezier(.2,.9,.25,1)}
/* 見出しのピンク帯がまっすぐ(日がすべて閉じている)ときは、日と日の隙間を半分(22px→11px)にする。1つでも開くと元の間隔に戻る */
.hero-h.flat~.tlv>.day-g+.day-g{margin-top:7px}
.hero-h.flat~.tlv>.day-g>.day-h{margin-bottom:4px}
.hero-h.flat~.tlv>.more-b{margin-top:6px}   /* 「その次のSARD UNDERGROUND」(MORE)との間隔も半分(12px→6px) */
.agenda::before,.tlv::before{transition:bottom .26s cubic-bezier(.2,.9,.25,1)}
.hero-h.flat~.agenda::before,.hero-h.flat~.tlv:not(:has(>.more-b))::before{bottom:4px}   /* 閉じて帯がまっすぐのときは、縦のラインを最後の帯の下端で止める(帯の下にはみ出さない)。MOREがあるときは、ボタンまでつなぐ */
.hero-h.flat~.agenda>.day-sec:not(:first-child){margin-top:7px}
.hero-h.flat~.agenda>.day-sec>.day-h{margin-bottom:4px}
/* 日付の帯もカードと同じ現れ方(TODAY・Next・BEFORE・AFTER、追加読み込み分も) */
.day-h{animation:pIn .32s cubic-bezier(.2,.9,.25,1.1) both}
body.noanim .day-h,body.shifting .day-h{animation:none!important}
.tm{font:500 13px ui-monospace,monospace;color:var(--mut)}
/* ===== MOREボタン: 日付の帯と同じ仲間(暗い帯・右は斜め・左に青い斜めのライン) ===== */
.more-b{position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0 0;box-shadow:-22px 0 0 0 var(--bg);min-height:44px;padding:0 18px;border:0;background:none;color:var(--fg);font:700 16px ui-monospace,monospace;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.more-b::after{content:"";position:absolute;inset:0 0 0 -19px;z-index:-2;background:var(--card);clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%);transition:clip-path .26s cubic-bezier(.2,.9,.25,1.2)}
.more-b.pr::after,.more-b:active::after{clip-path:polygon(16px 0,100% 0,calc(100% - 10px) 100%,6px 100%)}
.more-b:has(.chv.go)::after{clip-path:polygon(6px 0,100% 0,calc(100% - 10px) 100%,6px 100%)}   /* 「つづきのSARD UNDERGROUND」の枠は、閉じていてもずっと斜め */
.more-b.pr:has(.chv.go)::after,.more-b:active:has(.chv.go)::after{clip-path:polygon(16px 0,100% 0,calc(100% - 10px) 100%,6px 100%)}
.more-b::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:18px;z-index:-1;background:var(--grad);clip-path:polygon(0 0,8px 0,8px 100%,0 100%);transition:clip-path .26s cubic-bezier(.2,.9,.25,1.2)}   /* 押す前はまっすぐ */
.more-b.pr::before,.more-b:active::before{clip-path:polygon(10px 0,18px 0,8px 100%,0 100%)}   /* 押すと斜めに切り替わる(角度は日付の帯と同じ) */
.more-l{font:700 16px ui-monospace,monospace;letter-spacing:.02em;color:var(--fg)}   /* 日付と同じ文字デザイン */
/* ===== 押せることを示す矢印(文字ではなくCSSで描く。Bloggerで文字化けしない) ===== */
.chv{flex:none;display:inline-block;width:9px;height:9px;margin:0 4px 3px auto;border-right:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:rotate(45deg);transition:transform .26s cubic-bezier(.2,.9,.25,1.2)}
.day-g.xall:not(.closed)>.day-h .chv{transform:rotate(225deg)}   /* 全部開いているときだけ上向き(押すと閉じる)。それ以外は下向き(押すと開く) */
.more-b .chv{border-color:var(--main);transform:rotate(45deg)}
.more-b .chv.go{transform:rotate(-45deg)}
.day-h .chv{opacity:.75}
.more-b:active,.day-h:active{filter:brightness(1.3)}
@media (hover:hover){.more-b:hover,.day-h:hover{filter:brightness(1.2)}}
.mstrip.mm{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;overflow:visible;padding:2px}   /* 月(1〜12)は、スマホでも横にはみ出さず1画面に収める(6列x2段。広い画面では12列x1段) */
.mstrip.mm .chip{padding:0;min-width:0;width:100%;height:40px;display:flex;align-items:center;justify-content:center}
@media (min-width:640px){.mstrip.mm{grid-template-columns:repeat(12,1fr)}}
.aft{margin-left:10px;font-size:13px;font-weight:700;color:var(--main)}
.day-h,.more-b{box-sizing:border-box;height:36px;min-height:0;padding-top:0;padding-bottom:0}   /* 日付の帯とMOREボタンは同じ高さ */
#recBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.25;padding:10px 14px;border-radius:14px}   /* 縦長・中央そろえ */
#recBtn[hidden]{display:none}
#recBtn span:first-child{font-weight:700;font-size:14px;letter-spacing:.1em}
#recBtn .un{display:block;font-family:'Anton','Noto Sans JP',sans-serif;font-weight:400;font-size:13px;line-height:1;letter-spacing:.04em;white-space:nowrap;transform:scaleY(1.7);margin:7px 0 5px;-webkit-text-stroke:.7px var(--card)}   /* 細い字体(Anton)を縦に引き伸ばして、縦に細長い英字にする。背景色の縁取りで字を少し細くする */
/* ===== カードの展開: 時刻+タイトルだけを見せ、押すと補足が展開(斜めに切り込んで入る) ===== */
.card.fold{cursor:pointer}
.cx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.9,.25,1)}
.card.open>.cx{grid-template-rows:1fr}
.cxi{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:3px;visibility:hidden;transition:visibility 0s .3s}
.card.open .cxi{visibility:visible;transition-delay:0s}
.card.open .cxi>*{animation:pIn .32s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i,0) * 50ms + 60ms)}
.card.open>.cx>.cxi{padding-top:6px}
.card.fold .hd .chv{margin:6px 9px 0 6px;transform:rotate(45deg)}
.card.fold.open .hd .chv{transform:rotate(225deg)}
.card.fold.open{border-color:var(--main);box-shadow:inset 3px 0 0 var(--main)}
.card.fold.open.att{border-left-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}   /* 開いたときも、左側の線だけピンク */
/* ===== 検索窓の下に展開するフィルターチップ(さんぷる) ===== */
.sfc{position:relative;z-index:30;display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.9,.25,1),margin .28s cubic-bezier(.2,.9,.25,1)}   /* 画面の流れの中に置く(開くと下の内容が下がり、閉じると戻る) */
.sfc.open{grid-template-rows:1fr;margin-bottom:8px}
.sfi{position:relative;isolation:isolate;overflow:hidden;min-height:0;padding:0 8px 0 24px;visibility:hidden;transition:visibility 0s .28s}
.sfc.open .sfi{visibility:visible;transition-delay:0s;padding:10px 8px 0 24px}
.sfi::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(rgba(var(--main-rgb),.12),rgba(var(--main-rgb),.12)),var(--card);box-shadow:inset 0 0 0 1px rgba(var(--main-rgb),.55);clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%)}   /* 縁はまっすぐ(斜めにするとスマホで欠けて見える) */
.sfi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;z-index:-1;background:var(--grad)}   /* 青い帯はまっすぐ */
.sfr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
.sfl{flex:none;width:76px;font-size:12px;letter-spacing:.08em;color:var(--mut)}
.sfc.open .chip{animation:pIn .3s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i,0) * 30ms + 60ms)}
   /* 絞り込み中は検索窓に印 */
.fclr{color:var(--mut)}
.hero-h{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
/* 見出しを押すと、文字が少し光る */
@keyframes glow{0%{text-shadow:0 0 14px rgba(var(--main-rgb),.95),0 0 4px rgba(var(--main-rgb),.8)}100%{text-shadow:0 0 0 rgba(var(--main-rgb),0)}}
.hero-h.fl .hero-l{animation:glow .4s ease-out}
.hero-h:active .hero-l{text-shadow:0 0 12px rgba(var(--main-rgb),.8)}
@media (hover:hover){.hero-h:hover .hero-l{text-shadow:0 0 8px rgba(var(--main-rgb),.45)}}
.sfb{position:relative;justify-content:center;align-items:flex-end;min-height:44px;margin:6px -8px 0 -24px;padding:0 8px 0 24px;cursor:pointer}   /* 枠の左端から右端まで */
.sfb .fclr{position:absolute;right:8px;bottom:3px;cursor:pointer}
.sfclose{display:flex;align-items:center;justify-content:center;width:88px;height:36px;margin:0 0 3px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sfclose .chv{margin:0 0 -4px;border-color:var(--main);transform:rotate(225deg)}
.sfclose:active .chv{filter:brightness(1.4)}
#q:focus-visible{outline-color:var(--main)}
/* ===== チップ: 斜めに切った平行四辺形(見出しの帯・日付の帯の仲間)。選ぶと青く塗られ、形がもう少し斜めに動く ===== */
@keyframes chipK{0%{clip-path:polygon(var(--sl,7.5px) 0,100% 0,calc(100% - var(--sl,7.5px)) 100%,0 100%);animation-timing-function:cubic-bezier(0,0,.2,1)}14%{clip-path:polygon(calc(var(--sl,7.5px) * 2.2) 0,100% 0,calc(100% - var(--sl,7.5px) * 2.2) 100%,0 100%);animation-timing-function:cubic-bezier(.2,.9,.3,1.25)}100%{clip-path:polygon(var(--sl,7.5px) 0,100% 0,calc(100% - var(--sl,7.5px)) 100%,0 100%)}}   /* ふだんは日付の帯と同じ角度(高さ÷3をpxで --sl に)。押す・選ぶと一瞬だけ角度を倒して戻る */
.chip{--sl:7.5px}#modes .chip{--sl:8px}.mstrip .chip{--sl:10.5px}.mstrip.mm .chip{--sl:11px}
.chip{--bc:var(--line);position:relative;isolation:isolate;border:0;border-radius:0;background:var(--bc);padding-left:17px;padding-right:17px;clip-path:polygon(var(--sl,7.5px) 0,100% 0,calc(100% - var(--sl,7.5px)) 100%,0 100%);transition:clip-path .24s cubic-bezier(.2,.9,.25,1.2),color .18s,background .18s,transform .12s}
.chip::before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--face);clip-path:polygon(var(--sl,7.5px) 0,100% 0,calc(100% - var(--sl,7.5px)) 100%,0 100%);transition:clip-path .24s cubic-bezier(.2,.9,.25,1.2),background .18s}
.chip.dat,.mstrip .chip.dat{--bc:var(--main);border-color:transparent}
.chip.on{background:var(--grad);border-color:transparent;color:var(--on);clip-path:polygon(var(--sl,7.5px) 0,100% 0,calc(100% - var(--sl,7.5px)) 100%,0 100%);animation:chipK .3s linear var(--kd,0ms)}
.chip:active{background:var(--grad);border-color:transparent;color:var(--on);transition-duration:0s}   /* 押した瞬間に青くなる(選択時と同じ色) */
.chip:active::before{background:transparent;transition-duration:0s}
.chip.on::before{background:transparent;clip-path:polygon(var(--sl,7.5px) 0,100% 0,calc(100% - var(--sl,7.5px)) 100%,0 100%);animation:chipK .3s linear var(--kd,0ms)}
.mstrip.mm .chip{padding-left:0;padding-right:0}
/* ===== フィルターのボタン(検索窓の下の小さな帯)と、選んでいる絞り込みの一覧 ===== */
.fbar{display:block;margin:0}
.fsel:not(:empty){display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}   /* 選んだチップと下のライン: 6px */
.qbox{display:flex;align-items:stretch;flex:1;min-width:0;margin:0 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.qbox:focus-within{border-color:var(--main)}
#qrow.fon .qbox:focus-within{box-shadow:0 0 0 2px rgba(var(--main-rgb),.5)}
.qbox #q{flex:1;min-width:0;width:auto;margin:0;border:0;border-radius:0;background:none;box-shadow:none}
.qbox #q:focus,.qbox #q:focus-visible{outline:none;box-shadow:none}
.qx{display:none}
@media(max-width:640px){.qx{display:flex;flex:none;align-items:center;justify-content:center;width:38px;padding:0;border:0;background:none;color:var(--mut);cursor:pointer;-webkit-tap-highlight-color:transparent}.qx:active{color:var(--fg)}#q:placeholder-shown~.qx{display:none}#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}}   /* スマホ: 文字が入っているときは、フォーカスに関係なく右端に✕を出す */
.fbtn{position:relative;isolation:isolate;display:flex;align-items:center;gap:8px;flex:none;padding:0 14px 0 26px;border:0;background:none;color:var(--fg);font:700 13px ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fbtn::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--card2);clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.fbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:40px;z-index:-1;background:var(--grad);clip-path:polygon(12px 0,18px 0,6px 100%,0 100%)}
@keyframes fbA{0%{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);animation-timing-function:cubic-bezier(0,0,.2,1)}14%{clip-path:polygon(27px 0,100% 0,100% 100%,0 100%);animation-timing-function:cubic-bezier(.2,.9,.3,1.25)}100%{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}}
@keyframes fbB{0%{clip-path:polygon(12px 0,18px 0,6px 100%,0 100%);animation-timing-function:cubic-bezier(0,0,.2,1)}14%{clip-path:polygon(27px 0,33px 0,6px 100%,0 100%);animation-timing-function:cubic-bezier(.2,.9,.3,1.25)}100%{clip-path:polygon(12px 0,18px 0,6px 100%,0 100%)}}
.fbtn.kick::after{animation:fbA .3s linear}
.fbtn.kick::before{animation:fbB .3s linear}   /* ふだんは日付の帯と同じ角度(高さ÷3: 44pxなら約15px)。押すと一瞬だけ角度を倒して戻る */
.fbtn .chv{margin:0 0 3px 2px;border-color:var(--main);transform:rotate(45deg)}
.fbtn.open .chv{transform:rotate(225deg)}
.fbtn:active{filter:brightness(1.3);color:var(--on)}
.fbtn:active::after{background:var(--grad)}
#qrow.fon .fbtn::before{background:var(--acc)}   /* FILTERを1つでも選んでいるとき、左の斜めの帯はアクセント色 */   /* 押した瞬間に青くなる */
.fbtn:active .chv{border-color:var(--on)}
.fn{color:var(--main)}
.fsel{display:flex;flex-wrap:wrap;gap:6px}
.fsel .chip{font-size:12px;padding-right:12px}
.xm{display:inline-block;position:relative;width:9px;height:9px;margin-left:8px;vertical-align:-1px}
.xm::before,.xm::after{content:"";position:absolute;left:0;top:4px;width:9px;height:2px;background:currentColor;transform:rotate(45deg)}
.xm::after{transform:rotate(-45deg)}
.day-h,.more-b{padding-left:13px}   /* 日付・MOREの文字の左端を、カードの時刻・タイトルの左端(枠1px+余白12px)にそろえる */
.grid.emp{padding-left:20px}   /* 縦線の中に入らない「予定はありません」も、他のカードの左端にそろえる */
dialog{border-color:var(--main)}   /* 詳細ウィンドウの枠も青 */
